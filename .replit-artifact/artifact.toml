kind = "web"
previewPath = "/"
title = "Full Stack Engineer Portfolio"
description = "A premium, conversion-focused portfolio for a full stack engineer offering websites, web applications, backend systems, APIs, SEO, performance optimization, and ongoing technical support."
version = "1.0.0"
id = "artifacts/full-stack-portfolio"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20317

[services.development]
run = "pnpm --filter @workspace/full-stack-portfolio run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/full-stack-portfolio", "run", "build" ]
serve = "static"
publicDir = "artifacts/full-stack-portfolio/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20317"
BASE_PATH = "/"
